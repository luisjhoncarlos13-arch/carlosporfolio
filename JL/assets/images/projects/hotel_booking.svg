<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="hbg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e223a"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <filter id="hglow">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#hbg)"/>
  <rect x="50" y="40" width="700" height="370" rx="14" fill="#0b1122" stroke="#00f3ff" stroke-width="2" filter="url(#hglow)"/>
  <!-- Header -->
  <rect x="50" y="40" width="700" height="50" rx="14" fill="#0f1a30"/>
  <text x="80" y="72" fill="#00f3ff" font-family="'Orbitron', monospace" font-size="18" font-weight="bold">LUMINA RESORTS &amp; SUITES</text>
  <text x="630" y="72" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="13">● 84% Occupancy</text>

  <!-- Left Sidebar Navigation -->
  <rect x="70" y="110" width="160" height="275" rx="8" fill="#0f1a30"/>
  <text x="90" y="145" fill="#00f3ff" font-family="'Inter', sans-serif" font-size="13" font-weight="bold">▦ Overview</text>
  <text x="90" y="180" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">🏨 Room Suites</text>
  <text x="90" y="215" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">📅 Calendar</text>
  <text x="90" y="250" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">👥 Guest List</text>
  <text x="90" y="285" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">💳 Invoices</text>

  <!-- Room Cards -->
  <rect x="250" y="110" width="220" height="275" rx="10" fill="#111c36" stroke="rgba(0,243,255,0.3)"/>
  <rect x="265" y="125" width="190" height="110" rx="6" fill="#1e2c4f"/>
  <text x="360" y="185" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle">🛏️</text>
  <text x="360" y="260" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Penthouse Suite</text>
  <text x="360" y="285" fill="#00f3ff" font-family="'JetBrains Mono', sans-serif" font-size="13" text-anchor="middle">$850 / night</text>
  <rect x="285" y="325" width="150" height="34" rx="6" fill="#00f3ff"/>
  <text x="360" y="347" fill="#060913" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BOOK ROOM</text>

  <rect x="490" y="110" width="240" height="275" rx="10" fill="#111c36" stroke="rgba(0,243,255,0.3)"/>
  <rect x="505" y="125" width="210" height="110" rx="6" fill="#1e2c4f"/>
  <text x="610" y="185" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle">🌊</text>
  <text x="610" y="260" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Panoramic Ocean View</text>
  <text x="610" y="285" fill="#00f3ff" font-family="'JetBrains Mono', sans-serif" font-size="13" text-anchor="middle">$620 / night</text>
  <rect x="535" y="325" width="150" height="34" rx="6" fill="#00f3ff"/>
  <text x="610" y="347" fill="#060913" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">BOOK ROOM</text>
</svg>
