<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f223d"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGlow)" stroke="#00f3ff" stroke-width="3" filter="url(#glow)" stroke-opacity="0.6"/>
  <circle cx="200" cy="200" r="175" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.4"/>

  <!-- Head / Hair Silhouette -->
  <path d="M140 160 C 135 105, 170 80, 200 80 C 230 80, 265 105, 260 160 C 255 190, 240 215, 200 215 C 160 215, 145 190, 140 160 Z" fill="#141f36" stroke="#00f3ff" stroke-width="2"/>
  
  <!-- Face -->
  <ellipse cx="200" cy="165" rx="42" ry="50" fill="#1e2c4a"/>
  
  <!-- Modern Hair -->
  <path d="M145 130 C 145 90, 180 82, 200 82 C 225 82, 255 90, 255 125 C 240 115, 220 112, 200 115 C 175 112, 160 118, 145 130 Z" fill="#00f3ff" opacity="0.85"/>

  <!-- Glowing Headphones -->
  <path d="M142 165 C 130 165, 125 150, 130 135 C 135 100, 165 90, 200 90 C 235 90, 265 100, 270 135 C 275 150, 270 165, 258 165" fill="none" stroke="#00f3ff" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <rect x="122" y="145" width="20" height="42" rx="10" fill="#0b1122" stroke="#00f3ff" stroke-width="2.5" filter="url(#glow)"/>
  <rect x="258" y="145" width="20" height="42" rx="10" fill="#0b1122" stroke="#00f3ff" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Developer Glasses -->
  <rect x="165" y="152" width="28" height="18" rx="4" fill="rgba(0, 243, 255, 0.15)" stroke="#00f3ff" stroke-width="2"/>
  <rect x="207" y="152" width="28" height="18" rx="4" fill="rgba(0, 243, 255, 0.15)" stroke="#00f3ff" stroke-width="2"/>
  <line x1="193" y1="161" x2="207" y2="161" stroke="#00f3ff" stroke-width="2"/>

  <!-- Shoulders / Hoodie Body -->
  <path d="M100 350 C 100 275, 145 250, 200 250 C 255 250, 300 275, 300 350 Z" fill="#0b1122" stroke="#00f3ff" stroke-width="2.5"/>
  <path d="M165 250 L 200 290 L 235 250 Z" fill="#141f36" stroke="#00f3ff" stroke-width="1.5"/>

  <!-- Code symbol badge on chest -->
  <text x="200" y="325" fill="#00f3ff" font-family="'Orbitron', monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">&lt;IT / DEV&gt;</text>
</svg>
