<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="ibg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#09252c"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <filter id="iglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#ibg)"/>

  <!-- Cyber Grid -->
  <g stroke="#00f3ff" stroke-width="1" opacity="0.12">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Frame -->
  <rect x="70" y="45" width="660" height="360" rx="14" fill="#0b1222" stroke="#00f3ff" stroke-width="1.8" filter="url(#iglow)"/>

  <!-- Header Bar -->
  <rect x="70" y="45" width="660" height="44" rx="14" fill="#0e182f"/>
  <circle cx="100" cy="67" r="6" fill="#ff5f56"/>
  <circle cx="120" cy="67" r="6" fill="#ffbd2e"/>
  <circle cx="140" cy="67" r="6" fill="#27c93f"/>

  <!-- Title -->
  <rect x="170" y="53" width="250" height="28" rx="6" fill="#14223d" stroke="rgba(0,243,255,0.3)"/>
  <text x="185" y="72" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">⚡ Arduino_IoT_Circuit.cpp</text>

  <rect x="560" y="55" width="150" height="24" rx="12" fill="rgba(0,243,255,0.12)" stroke="rgba(0,243,255,0.4)"/>
  <circle cx="574" cy="67" r="4" fill="#00f3ff"/>
  <text x="586" y="71" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="11">SENSORS: ONLINE</text>

  <!-- Left: Circuit Layout & Microcontroller Schematic -->
  <rect x="95" y="110" width="320" height="270" rx="10" fill="#061826" stroke="#00f3ff" stroke-width="1.2"/>
  
  <!-- Arduino Board Body -->
  <rect x="120" y="130" width="270" height="150" rx="8" fill="#0b3846" stroke="#00ffaa" stroke-width="1.2"/>
  <text x="255" y="155" fill="#00ffaa" font-family="'Orbitron', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ATmega328P MCU</text>

  <!-- MCU Chip -->
  <rect x="175" y="170" width="160" height="40" rx="4" fill="#06121e" stroke="#00f3ff"/>
  <text x="255" y="195" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">GPIO / PWM TRACES</text>

  <!-- Pinouts Top & Bottom -->
  <g fill="#ffbd2e">
    <rect x="135" y="125" width="8" height="6" rx="1"/>
    <rect x="155" y="125" width="8" height="6" rx="1"/>
    <rect x="175" y="125" width="8" height="6" rx="1"/>
    <rect x="195" y="125" width="8" height="6" rx="1"/>
    <rect x="215" y="125" width="8" height="6" rx="1"/>
    <rect x="235" y="125" width="8" height="6" rx="1"/>
    <rect x="255" y="125" width="8" height="6" rx="1"/>
    <rect x="275" y="125" width="8" height="6" rx="1"/>
    <rect x="295" y="125" width="8" height="6" rx="1"/>
    <rect x="315" y="125" width="8" height="6" rx="1"/>
  </g>

  <!-- Ultrasonic Sensor Indicator Box -->
  <rect x="120" y="295" width="125" height="65" rx="6" fill="#0f2638" stroke="rgba(0,243,255,0.4)"/>
  <circle cx="150" cy="328" r="14" fill="#1b3f5c" stroke="#00f3ff"/>
  <circle cx="195" cy="328" r="14" fill="#1b3f5c" stroke="#00f3ff"/>
  <text x="182" y="310" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ULTRASONIC</text>

  <!-- 5V Relay Box -->
  <rect x="265" y="295" width="125" height="65" rx="6" fill="#092032" stroke="#00ffaa" stroke-width="1"/>
  <text x="327" y="322" fill="#00ffaa" font-family="'Orbitron', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">5V RELAY</text>
  <text x="327" y="342" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">12V SOLENOID</text>

  <!-- Right: Code snippet & Tech tags -->
  <rect x="435" y="110" width="270" height="270" rx="10" fill="#070c18" stroke="rgba(0,243,255,0.2)"/>

  <text x="455" y="138" fill="#eab308" font-family="'JetBrains Mono', monospace" font-size="11">// Real-time Distance Trigger</text>
  <text x="455" y="162" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">long duration, distance;</text>
  <text x="455" y="186" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">if <tspan fill="#f8fafc">(distance &lt;= 10) {</tspan></text>
  <text x="470" y="210" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="11">digitalWrite(RELAY, LOW);</text>
  <text x="470" y="234" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">// Dispense Liquid</text>
  <text x="455" y="258" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">}</text>

  <!-- Hardware Component Badges -->
  <g transform="translate(450, 275)">
    <rect x="0" y="0" width="115" height="24" rx="12" fill="rgba(0,243,255,0.12)" stroke="#00f3ff"/>
    <text x="57" y="16" fill="#00f3ff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Arduino C++</text>

    <rect x="125" y="0" width="115" height="24" rx="12" fill="rgba(0,243,255,0.12)" stroke="#00f3ff"/>
    <text x="182" y="16" fill="#00f3ff" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">IoT Automation</text>
  </g>

  <!-- Proficiency Meter -->
  <rect x="450" y="340" width="240" height="24" rx="6" fill="#0a1020" stroke="rgba(0,243,255,0.2)"/>
  <rect x="452" y="342" width="206" height="20" rx="4" fill="linear-gradient(90deg, #0d9488, #00f3ff)"/>
  <text x="570" y="356" fill="#060913" font-family="'Orbitron', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">86% PROFICIENCY</text>
</svg>
