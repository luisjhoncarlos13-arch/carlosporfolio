<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="nbg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141838"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <filter id="nglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#nbg)"/>

  <!-- Cyber Grid -->
  <g stroke="#00f3ff" stroke-width="1" opacity="0.12">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Frame -->
  <rect x="70" y="45" width="660" height="360" rx="14" fill="#0b1222" stroke="#00f3ff" stroke-width="1.8" filter="url(#nglow)"/>

  <!-- Header Bar -->
  <rect x="70" y="45" width="660" height="44" rx="14" fill="#0e182f"/>
  <circle cx="100" cy="67" r="6" fill="#ff5f56"/>
  <circle cx="120" cy="67" r="6" fill="#ffbd2e"/>
  <circle cx="140" cy="67" r="6" fill="#27c93f"/>

  <!-- Title -->
  <rect x="170" y="53" width="280" height="28" rx="6" fill="#14223d" stroke="rgba(0,243,255,0.3)"/>
  <text x="185" y="72" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">🛡️ Network_Systems_NCII.cfg</text>

  <rect x="560" y="55" width="150" height="24" rx="12" fill="rgba(0,255,170,0.12)" stroke="rgba(0,255,170,0.4)"/>
  <circle cx="574" cy="67" r="4" fill="#00ffaa"/>
  <text x="586" y="71" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="11">CERTIFIED: NC II</text>

  <!-- Left: Rack Server / Switch & LAN Topology Diagram -->
  <g transform="translate(100, 110)">
    <!-- Switch Chassis -->
    <rect x="0" y="0" width="310" height="60" rx="8" fill="#111c33" stroke="#00f3ff" stroke-width="1.5"/>
    <text x="15" y="25" fill="#38bdf8" font-family="'Orbitron', sans-serif" font-size="10" font-weight="bold">MANAGED SWITCH 24-PORT</text>
    
    <!-- 8 RJ45 Port Indicators with Status LEDs -->
    <g transform="translate(15, 34)">
      <rect x="0" y="0" width="18" height="14" rx="2" fill="#060913" stroke="#00f3ff"/>
      <circle cx="9" cy="-4" r="2.5" fill="#00ffaa"/>

      <rect x="25" y="0" width="18" height="14" rx="2" fill="#060913" stroke="#00f3ff"/>
      <circle cx="34" cy="-4" r="2.5" fill="#00ffaa"/>

      <rect x="50" y="0" width="18" height="14" rx="2" fill="#060913" stroke="#00f3ff"/>
      <circle cx="59" cy="-4" r="2.5" fill="#00ffaa"/>

      <rect x="75" y="0" width="18" height="14" rx="2" fill="#060913" stroke="#00f3ff"/>
      <circle cx="84" cy="-4" r="2.5" fill="#ffbd2e"/>

      <rect x="100" y="0" width="18" height="14" rx="2" fill="#060913" stroke="#00f3ff"/>
      <circle cx="109" cy="-4" r="2.5" fill="#00ffaa"/>

      <rect x="125" y="0" width="18" height="14" rx="2" fill="#060913" stroke="#00f3ff"/>
      <circle cx="134" cy="-4" r="2.5" fill="#00ffaa"/>

      <rect x="150" y="0" width="18" height="14" rx="2" fill="#060913" stroke="#00f3ff"/>
      <circle cx="159" cy="-4" r="2.5" fill="#00ffaa"/>

      <rect x="175" y="0" width="18" height="14" rx="2" fill="#060913" stroke="#00f3ff"/>
      <circle cx="184" cy="-4" r="2.5" fill="#00ffaa"/>
    </g>

    <!-- Network Topology Tree -->
    <g transform="translate(20, 85)">
      <!-- Router Node -->
      <rect x="90" y="0" width="100" height="34" rx="6" fill="#18294a" stroke="#00f3ff"/>
      <text x="140" y="21" fill="#00f3ff" font-family="'Orbitron', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">GATEWAY</text>

      <!-- Connecting Lines -->
      <line x1="140" y1="34" x2="140" y2="60" stroke="#00f3ff" stroke-width="1.5"/>
      <line x1="40" y1="60" x2="240" y2="60" stroke="#00f3ff" stroke-width="1.5"/>

      <line x1="40" y1="60" x2="40" y2="80" stroke="#00f3ff" stroke-width="1.5"/>
      <line x1="140" y1="60" x2="140" y2="80" stroke="#00f3ff" stroke-width="1.5"/>
      <line x1="240" y1="60" x2="240" y2="80" stroke="#00f3ff" stroke-width="1.5"/>

      <!-- Workstation Nodes -->
      <rect x="0" y="80" width="80" height="30" rx="4" fill="#0b162c" stroke="rgba(0,243,255,0.4)"/>
      <text x="40" y="99" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">WS-01</text>

      <rect x="100" y="80" width="80" height="30" rx="4" fill="#0b162c" stroke="rgba(0,243,255,0.4)"/>
      <text x="140" y="99" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">SRV-MAIN</text>

      <rect x="200" y="80" width="80" height="30" rx="4" fill="#0b162c" stroke="rgba(0,243,255,0.4)"/>
      <text x="240" y="99" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">WS-02</text>

      <!-- Subnet Badge -->
      <rect x="65" y="130" width="150" height="22" rx="4" fill="#060f1e" stroke="#00ffaa"/>
      <text x="140" y="145" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">192.168.1.0/24 VLAN</text>
    </g>
  </g>

  <!-- Right: NC II Badge & Diagnostics Console -->
  <rect x="435" y="110" width="270" height="270" rx="10" fill="#070c18" stroke="rgba(0,243,255,0.2)"/>

  <!-- NC II Verified Seal Banner -->
  <rect x="455" y="130" width="230" height="50" rx="8" fill="rgba(0,243,255,0.1)" stroke="#00f3ff" stroke-width="1.2"/>
  <text x="475" y="152" fill="#ffbd2e" font-size="16">★</text>
  <text x="500" y="150" fill="#ffffff" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold">TESDA NC II CERTIFIED</text>
  <text x="500" y="168" fill="#00f3ff" font-family="'Inter', sans-serif" font-size="10">Computer Systems Servicing</text>

  <!-- Diagnostics Log Output -->
  <text x="455" y="205" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">$ ping -c 4 192.168.1.1</text>
  <text x="455" y="225" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="10">64 bytes from 192.168.1.1: icmp_seq=1 ttl=64 time=0.42 ms</text>
  <text x="455" y="245" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Packet loss: 0% [PERFECT LINK]</text>
  
  <text x="455" y="275" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">$ netsh int ip show config</text>
  <text x="455" y="295" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="10">Subnet Mask: 255.255.255.0</text>

  <!-- Proficiency Meter -->
  <rect x="450" y="340" width="240" height="24" rx="6" fill="#0a1020" stroke="rgba(0,243,255,0.2)"/>
  <rect x="452" y="342" width="211" height="20" rx="4" fill="linear-gradient(90deg, #6366f1, #00f3ff)"/>
  <text x="570" y="356" fill="#060913" font-family="'Orbitron', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">88% PROFICIENCY • NC II</text>
</svg>
