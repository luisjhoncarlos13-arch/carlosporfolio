<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="wbg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0c1a30"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="wglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#wbg)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="#00f3ff" stroke-width="1" opacity="0.12">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Browser / IDE Window Container -->
  <rect x="70" y="45" width="660" height="360" rx="14" fill="#0b1222" stroke="#00f3ff" stroke-width="1.8" filter="url(#wglow)"/>

  <!-- Window Header Bar -->
  <rect x="70" y="45" width="660" height="44" rx="14" fill="#0e182f"/>
  <circle cx="100" cy="67" r="6" fill="#ff5f56"/>
  <circle cx="120" cy="67" r="6" fill="#ffbd2e"/>
  <circle cx="140" cy="67" r="6" fill="#27c93f"/>

  <!-- Tab Title -->
  <rect x="170" y="53" width="220" height="28" rx="6" fill="#14223d" stroke="rgba(0,243,255,0.3)"/>
  <text x="185" y="72" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">&lt;/&gt; WebArchitecture.php</text>

  <!-- Status indicator on header -->
  <rect x="580" y="55" width="130" height="24" rx="12" fill="rgba(0,243,255,0.12)" stroke="rgba(0,243,255,0.4)"/>
  <circle cx="594" cy="67" r="4" fill="#00f3ff"/>
  <text x="606" y="71" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="11">HTTP 200 OK</text>

  <!-- Left Side: Code Editor Mockup -->
  <rect x="95" y="110" width="360" height="270" rx="10" fill="#070c18" stroke="rgba(0,243,255,0.2)"/>
  
  <text x="115" y="140" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">01</text>
  <text x="145" y="140" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="12">&lt;?php</text>

  <text x="115" y="168" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">02</text>
  <text x="145" y="168" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">class <tspan fill="#00f3ff" font-weight="bold">FullStackApp</tspan> {</text>

  <text x="115" y="196" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">03</text>
  <text x="165" y="196" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12">public function <tspan fill="#38bdf8">renderUI</tspan>() {</text>

  <text x="115" y="224" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">04</text>
  <text x="185" y="224" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">return $this-&gt;<tspan fill="#22c55e">dispatchResponse</tspan>();</text>

  <text x="115" y="252" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">05</text>
  <text x="165" y="252" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12">}</text>

  <text x="115" y="280" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">06</text>
  <text x="165" y="280" fill="#eab308" font-family="'JetBrains Mono', monospace" font-size="12">// REST API &amp; AJAX Engine</text>

  <text x="115" y="308" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">07</text>
  <text x="165" y="308" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="12">echo json_encode(['status' =&gt; 200]);</text>

  <text x="115" y="336" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">08</text>
  <text x="145" y="336" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">}</text>

  <text x="115" y="360" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="12">09</text>
  <text x="145" y="360" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="12">?&gt;</text>

  <!-- Right Side: Responsive App & Tech Pill UI Preview -->
  <rect x="475" y="110" width="230" height="270" rx="10" fill="#0f1a30" stroke="rgba(0,243,255,0.25)"/>

  <!-- Device Window Frame Mockup -->
  <rect x="495" y="130" width="190" height="115" rx="8" fill="#14213d" stroke="rgba(0,243,255,0.4)"/>
  <rect x="505" y="142" width="60" height="10" rx="3" fill="#00f3ff"/>
  <rect x="575" y="142" width="25" height="10" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="605" y="142" width="25" height="10" rx="3" fill="rgba(255,255,255,0.2)"/>
  <rect x="635" y="142" width="40" height="10" rx="3" fill="#00ffaa"/>

  <!-- Hero Banner inside Mockup -->
  <rect x="505" y="160" width="170" height="42" rx="4" fill="linear-gradient(90deg, rgba(0,243,255,0.3), rgba(0,102,255,0.3))"/>
  <text x="590" y="185" fill="#ffffff" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">WEB APP ⚡</text>

  <!-- Tech Badges on Right -->
  <rect x="495" y="260" width="85" height="26" rx="13" fill="rgba(0,243,255,0.15)" stroke="#00f3ff" stroke-width="1"/>
  <text x="537" y="277" fill="#00f3ff" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">PHP 8</text>

  <rect x="590" y="260" width="95" height="26" rx="13" fill="rgba(0,243,255,0.15)" stroke="#00f3ff" stroke-width="1"/>
  <text x="637" y="277" fill="#00f3ff" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">JavaScript</text>

  <rect x="495" y="296" width="95" height="26" rx="13" fill="rgba(0,243,255,0.15)" stroke="#00f3ff" stroke-width="1"/>
  <text x="542" y="313" fill="#00f3ff" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">CSS3 / HTML5</text>

  <rect x="600" y="296" width="85" height="26" rx="13" fill="rgba(0,243,255,0.15)" stroke="#00f3ff" stroke-width="1"/>
  <text x="642" y="313" fill="#00f3ff" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">REST APIs</text>

  <!-- Performance Meter -->
  <rect x="495" y="340" width="190" height="24" rx="6" fill="#080e1c" stroke="rgba(0,243,255,0.2)"/>
  <rect x="497" y="342" width="175" height="20" rx="4" fill="linear-gradient(90deg, #0088ff, #00f3ff)"/>
  <text x="590" y="356" fill="#060913" font-family="'Orbitron', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">92% PROFICIENCY</text>
</svg>
