<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="dbg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0e1f38"/>
      <stop offset="100%" stop-color="#060913"/>
    </radialGradient>
    <filter id="dglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#dbg)"/>

  <!-- Circuit grid pattern -->
  <g stroke="#00f3ff" stroke-width="1" opacity="0.12">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Main Window Frame -->
  <rect x="70" y="45" width="660" height="360" rx="14" fill="#0b1222" stroke="#00f3ff" stroke-width="1.8" filter="url(#dglow)"/>

  <!-- Header Bar -->
  <rect x="70" y="45" width="660" height="44" rx="14" fill="#0e182f"/>
  <circle cx="100" cy="67" r="6" fill="#ff5f56"/>
  <circle cx="120" cy="67" r="6" fill="#ffbd2e"/>
  <circle cx="140" cy="67" r="6" fill="#27c93f"/>

  <!-- Window Title -->
  <rect x="170" y="53" width="250" height="28" rx="6" fill="#14223d" stroke="rgba(0,243,255,0.3)"/>
  <text x="185" y="72" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">🗄️ MySQL_PDO_Engine.sql</text>

  <!-- Status indicator -->
  <rect x="560" y="55" width="150" height="24" rx="12" fill="rgba(0,255,170,0.12)" stroke="rgba(0,255,170,0.4)"/>
  <circle cx="574" cy="67" r="4" fill="#00ffaa"/>
  <text x="586" y="71" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="11">CONNECTED: 3306</text>

  <!-- Left Side: Database Server Cylinders / Visual Architecture -->
  <g transform="translate(110, 115)">
    <!-- Top Cylinder -->
    <path d="M 0,25 C 0,11 35,0 80,0 C 125,0 160,11 160,25 L 160,55 C 160,69 125,80 80,80 C 35,80 0,69 0,55 Z" fill="#132342" stroke="#00f3ff" stroke-width="1.5"/>
    <ellipse cx="80" cy="25" rx="80" ry="25" fill="#1b315b" stroke="#00f3ff" stroke-width="1.5"/>
    <text x="80" y="30" fill="#00f3ff" font-family="'Orbitron', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RELATIONAL DB</text>

    <!-- Middle Cylinder Ring -->
    <path d="M 0,70 C 0,84 35,95 80,95 C 125,95 160,84 160,70 L 160,115 C 160,129 125,140 80,140 C 35,140 0,129 0,115 Z" fill="#101d36" stroke="#00f3ff" stroke-width="1.5"/>
    <path d="M 0,70 C 0,84 35,95 80,95 C 125,95 160,84 160,70" fill="none" stroke="#00f3ff" stroke-width="1.5"/>
    <text x="80" y="112" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">PDO PREPARED</text>

    <!-- Bottom Cylinder Ring -->
    <path d="M 0,130 C 0,144 35,155 80,155 C 125,155 160,144 160,130 L 160,175 C 160,189 125,200 80,200 C 35,200 0,189 0,175 Z" fill="#0d172a" stroke="#00f3ff" stroke-width="1.5"/>
    <path d="M 0,130 C 0,144 35,155 80,155 C 125,155 160,144 160,130" fill="none" stroke="#00f3ff" stroke-width="1.5"/>
    <text x="80" y="172" fill="#00ffaa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">3NF SCHEMAS</text>

    <!-- Query pulse line -->
    <path d="M 160,110 L 210,110" stroke="#00f3ff" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="210" cy="110" r="4" fill="#00f3ff"/>
  </g>

  <!-- Right Side: SQL Query Console & Schema Tables -->
  <rect x="345" y="110" width="360" height="270" rx="10" fill="#070c18" stroke="rgba(0,243,255,0.2)"/>

  <!-- SQL Prompt -->
  <text x="365" y="138" fill="#eab308" font-family="'JetBrains Mono', monospace" font-size="12">-- Normalized Query with PDO Params</text>
  <text x="365" y="164" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">SELECT <tspan fill="#f8fafc">p.id, p.title, c.name</tspan></text>
  <text x="365" y="188" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">FROM <tspan fill="#00f3ff">projects</tspan> p</text>
  <text x="365" y="212" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">JOIN <tspan fill="#00f3ff">categories</tspan> c <tspan fill="#38bdf8">ON</tspan> p.cat_id = c.id</text>
  <text x="365" y="236" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12">WHERE <tspan fill="#f8fafc">p.featured = :status</tspan>;</text>

  <!-- Mini Table Results -->
  <rect x="365" y="255" width="320" height="75" rx="6" fill="#0f192d" stroke="rgba(0,243,255,0.25)"/>
  <rect x="365" y="255" width="320" height="24" rx="6" fill="#162747"/>
  <text x="375" y="271" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">ID</text>
  <text x="410" y="271" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">SYSTEM NAME</text>
  <text x="560" y="271" fill="#00f3ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">CATEGORY</text>

  <text x="375" y="295" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">#1</text>
  <text x="410" y="295" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10">Tapseafood Ordering</text>
  <text x="560" y="295" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Web App</text>

  <text x="375" y="316" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">#2</text>
  <text x="410" y="316" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10">Hotel Booking Mgmt</text>
  <text x="560" y="316" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Database</text>

  <!-- Proficiency bar at bottom -->
  <rect x="365" y="345" width="320" height="22" rx="5" fill="#0a1020" stroke="rgba(0,243,255,0.2)"/>
  <rect x="367" y="347" width="288" height="18" rx="3" fill="linear-gradient(90deg, #0284c7, #00f3ff)"/>
  <text x="525" y="360" fill="#060913" font-family="'Orbitron', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">90% PROFICIENCY • ADVANCED</text>
</svg>
